name: refresh 3d globe

# GITHUB_USERNAME = "Abhinay-code-max"
# Regenerates the 3D rotating contribution globe with Hyderabad pin

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-globe
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D Contribution Globe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/generate_globe.py

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- globe.svg)" ]; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add globe.svg
          git commit -m "chore: update 3D rotating contribution globe"
          git push
